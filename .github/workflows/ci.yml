name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo '${{github.repository}}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{github.sha}} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{env.REPO_LOWER}}:latest
            ghcr.io/${{env.REPO_LOWER}}:${{env.SHORT_SHA}}

  deploy-to-kind:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-test-cluster

      - name: Build Docker image
        run: docker build -t ci-cd-practice:ci-test .

      - name: Load image int kind
        run: kind load docker-image ci-cd-practice:ci-test --name ci-test-cluster

      - name: Deploy to kind
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/ci-cd-practice --timeout=60s

      - name: Smoke test
        run: |
          kubectl port-forward svc/ci-cd-practice 8080:80 &
          sleep 3
          curl --fail http://localhost:8080